[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpmslab"
version = "0.3.0"
description = "Direct conforming volume meshes for graded implicit TPMS lattices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
keywords = ["TPMS", "finite-element", "meshing", "graded-lattice", "COMSOL"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "trimesh>=4,<6"]

[project.optional-dependencies]
web = ["flask>=3.1,<4"]
test = ["pytest>=8,<10", "flask>=3.1,<4"]
dev = ["pytest>=8,<10", "flask>=3.1,<4", "build>=1.2", "twine>=6", "ruff>=0.12"]

[project.scripts]
tpmslab = "tpmslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tpmslab = ["families.json", "py.typed", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]
