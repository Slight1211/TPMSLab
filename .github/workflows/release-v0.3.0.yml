name: Prepare v0.3.0 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.3.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v0.3.0
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Slight1211/TPMSLab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d1829278a5b98d69fd57ecbe639e7bcb95ca577
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distributions
        run: |
          python -m pip install build twine ruff
          python -m ruff check src tests benchmarks
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside checkout
        run: |
          wheel=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          python -m pip install "${wheel}[test]"
          cd "$RUNNER_TEMP"
          python -I -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q --junitxml="$GITHUB_WORKSPACE/dist/clean-wheel-tests.xml"
          python -I "$GITHUB_WORKSPACE/benchmarks/release_reference.py" --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/release-reference"
          cp "$RUNNER_TEMP/release-reference/release_reference_check.json" "$GITHUB_WORKSPACE/dist/"
          python -m pip freeze > "$GITHUB_WORKSPACE/dist/build-environment.txt"
      - name: Assemble versioned evidence and checksums
        env:
          SOURCE_COMMIT: 5d1829278a5b98d69fd57ecbe639e7bcb95ca577
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('.')
          dist = root / 'dist'
          with zipfile.ZipFile(dist / 'TPMSLab-v0.3.0-validation.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for folder in ['validation', 'benchmarks', 'examples']:
                  for p in sorted((root / folder).rglob('*')):
                      if p.is_file() and '__pycache__' not in p.parts:
                          z.write(p, p.as_posix())
          (dist / 'RELEASE_PROVENANCE.json').write_text(json.dumps({
              'version': '0.3.0', 'source_commit': os.environ['SOURCE_COMMIT'],
              'scientific_baseline_commit': '686b783e0385ae40a8858f0aba15824c5d02ec92',
              'historical_measurements_replaced': False,
              'github_run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'checks': ['isolated build', 'twine', 'ruff', 'installed-wheel tests', 'installed-wheel Gyroid reference'],
              'comsol_run_in_this_workflow': False
          }, indent=2) + '\n')
          (dist / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in sorted(dist.iterdir()) if p.is_file() and p.name != 'SHA256SUMS.txt'))
          PY
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TPMSLab-v0.3.0-release-candidate
          path: dist/*
      - name: Create exact-commit draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: 5d1829278a5b98d69fd57ecbe639e7bcb95ca577
        run: |
          if gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v0.3.0 >/dev/null 2>&1; then
            echo 'v0.3.0 already exists; refusing to move or overwrite it.'
            exit 1
          fi
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'A v0.3.0 release already exists; refusing to overwrite it.'
            exit 1
          fi
          cp docs/RELEASE_NOTES_v0.3.0.md "$RUNNER_TEMP/release-notes.md"
          printf '\nExact source commit: `%s`.\n' "$SOURCE_COMMIT" >> "$RUNNER_TEMP/release-notes.md"
          gh release create v0.3.0 --target "$SOURCE_COMMIT" --title 'TPMS Lab v0.3.0' --notes-file "$RUNNER_TEMP/release-notes.md" --draft dist/*

