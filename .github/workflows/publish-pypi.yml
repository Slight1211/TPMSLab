name: Publish v0.3.0 to PyPI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pypi.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified v0.3.0 files to PyPI (configure Trusted Publisher first)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: pypi-v0.3.0
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Slight1211/TPMSLab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact reviewed release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Slight1211/TPMSLab
        run: |
          set -euo pipefail
          actual=$(gh api repos/Slight1211/TPMSLab/git/ref/tags/v0.3.0 --jq '.object.sha')
          test "$actual" = '5d1829278a5b98d69fd57ecbe639e7bcb95ca577'
          test "$(gh release view v0.3.0 --json isDraft --jq '.isDraft')" = 'false'
          mkdir dist
          gh release download v0.3.0 --dir dist --pattern 'tpmslab-0.3.0-py3-none-any.whl' --pattern 'tpmslab-0.3.0.tar.gz'
          cd dist
          echo '0a8f4c4e8d9a9a2dd6f93eac0b5fb88d23a952c217d53c918db1fa67c2702a4f  tpmslab-0.3.0-py3-none-any.whl' | sha256sum --check --strict
          echo 'c2551d210e8cf3c3375c48180da51158b2857de80ca9e95d110bf7ad55062981  tpmslab-0.3.0.tar.gz' | sha256sum --check --strict
      - name: Validate and smoke-test the published distributions
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
          python -m pip install dist/tpmslab-0.3.0-py3-none-any.whl
          python -m pip check
          python -I -c "from importlib.metadata import version; from tpmslab import Config, generate; assert version('tpmslab') == '0.3.0'; m = generate(Config(resolution=8, domain_mode='solid_fluid')); assert m['report']; print('Installed release mesh generation passed')"
          tpmslab --help
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-verified-v0.3.0
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tpmslab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-verified-v0.3.0
          path: dist/
      - name: Publish the existing release distributions
        uses: pypa/gh-action-pypi-publish@release/v1
