name: Publish v0.3.4 to PyPI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pypi.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-v0.3.4
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Slight1211/TPMSLab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e1a56021277556593a6e4925b91b78b93c77fb2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check exact source
        run: |
          python -m pip install ".[dev]"
          python -m ruff check src tests benchmarks
          python -m build
          python -m twine check --strict dist/*
      - name: Test installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/tpmslab-0.3.4-py3-none-any.whl
          cd "$RUNNER_TEMP"
          python -I -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q
          python -I -c "from importlib.metadata import version; from tpmslab import Config, generate; assert version('tpmslab') == '0.3.4'; mesh = generate(Config(resolution=8, m_cal=80, domain_mode='solid_fluid')); assert mesh['report']['config']['m_cal'] == 80; print('Installed wheel calibration and dual mesh passed')"
          python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-verified-v0.3.4
          path: dist/*
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tpmslab/0.3.4/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-verified-v0.3.4
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
