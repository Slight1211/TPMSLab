name: Publish v0.3.9 to PyPI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-pypi.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-v0.3.9
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Slight1211/TPMSLab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check this exact source
        run: |
          python -m pip install ".[dev]"
          python -m ruff check src tests benchmarks
          python -c "import tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == '0.3.9'"
          python -m build
          python -m twine check --strict dist/*
      - name: Test installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/tpmslab-0.3.9-py3-none-any.whl
          cd "$RUNNER_TEMP"
          python -I -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q --junitxml="$GITHUB_WORKSPACE/wheel-tests.xml"
          python -I -c "from importlib.metadata import version; from tpmslab import Config, __version__, generate; assert version('tpmslab') == __version__ == '0.3.9'; assert 'inversion_pairing' not in Config.__dataclass_fields__; m=generate(Config(resolution=8,domain_mode='solid_fluid',lattice='bcc',periodic_faces=True)); assert m['tetra'].shape[1] == 4; assert m['report']['periodic']['matched']; print('Installed 0.3.9 wheel / TET4 / periodic mesh passed')"
          python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-verified-v0.3.9
          path: dist/tpmslab-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stable-wheel-test-report
          path: wheel-tests.xml
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tpmslab/0.3.9/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-verified-v0.3.9
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: pypi-verified-v0.3.9
          path: dist/
      - name: Create the matching stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* > SHA256SUMS.txt
          gh release create v0.3.9 dist/* SHA256SUMS.txt --target "$GITHUB_SHA" --title "TPMS Lab v0.3.9" --latest --notes-file docs/RELEASE_0.3.9.md
